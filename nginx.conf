# Nginx Configuration for sms.ieosuia.com
# File: /etc/nginx/sites-available/sms.ieosuia.com

server {
    listen 80;
    listen [::]:80;
    server_name sms.ieosuia.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sms.ieosuia.com;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/sms.ieosuia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms.ieosuia.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Document root for React frontend (built files)
    root /var/www/sms.ieosuia.com/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API routes - proxy to Laravel
    location /api {
        alias /var/www/sms.ieosuia.com/api/public;
        try_files $uri $uri/ @api;

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
            
            # Increase timeouts for long-running requests
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
        }
    }

    location @api {
        rewrite ^/api/(.*)$ /api/index.php?/$1 last;
    }

    # Laravel storage files
    location /storage {
        alias /var/www/sms.ieosuia.com/api/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React Router - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    # Logging
    access_log /var/log/nginx/sms.ieosuia.com.access.log;
    error_log /var/log/nginx/sms.ieosuia.com.error.log;

    # Upload limits
    client_max_body_size 20M;
}

# Commands:
# sudo ln -s /etc/nginx/sites-available/sms.ieosuia.com /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx
# sudo certbot --nginx -d sms.ieosuia.com

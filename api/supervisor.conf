# Supervisor Configuration for IEOSUIA SMS Portal Queue Workers
# File: /etc/supervisor/conf.d/smsportal.conf

[program:smsportal-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms.ieosuia.com/api/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/sms.ieosuia.com/api/storage/logs/worker-default.log
stopwaitsecs=3600

[program:smsportal-sms]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms.ieosuia.com/api/artisan queue:work database --queue=sms --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/sms.ieosuia.com/api/storage/logs/worker-sms.log
stopwaitsecs=3600

[program:smsportal-email]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sms.ieosuia.com/api/artisan queue:work database --queue=email --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/sms.ieosuia.com/api/storage/logs/worker-email.log
stopwaitsecs=3600

[group:smsportal-workers]
programs=smsportal-default,smsportal-sms,smsportal-email
priority=999

# Commands:
# sudo supervisorctl reread
# sudo supervisorctl update
# sudo supervisorctl start smsportal-workers:*
# sudo supervisorctl status

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, '') || '/';
        if (path === '/login' && !window.location.hash.includes('ieosuia_token=')) window.location.replace('/api/auth/ieosuia/start');
        if (path === '/register') window.location.replace('/api/auth/ieosuia/start?screen_hint=signup');
      })();
    </script>
    <title>IEOSUIA SMS Portal</title>
    <meta name="description" content="IEOSUIA SMS Portal for SMS and email campaign management." />
    <meta name="author" content="IEOSUIA SMS Portal" />

    <meta property="og:title" content="IEOSUIA SMS Portal" />
    <meta property="og:description" content="IEOSUIA SMS Portal for SMS and email campaign management." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.ico" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ieosuia" />
    <meta name="twitter:image" content="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
